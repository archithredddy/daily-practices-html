<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style class="text/css">
        dt{
            background-color: black;
            color: white;
            font-size: 25px;
            padding: 10px;
            width: 200px;
            margin-bottom: 20px;
        }
        dd{
            background-color: lightgray;
            font-size: 25px;
            padding: 10px;
            color: black;
            width: 400px;
            margin-bottom: 20px;
        }
        dl{
            display: grid;
            grid-template-columns: 3fr 9fr;
        }
    </style>
</head>
<body>
    <dl>
        <dt>First Name</dt>
        <dd>Some name</dd>

        <dt>Last Name</dt>
        <dd>Some name</dd>

        <dt>Father Name</dt>
        <dd>Some name</dd>

        <dt>Age</dt>
        <dd>Some number</dd>

        <dt>Date of Birth</dt>
        <dd>Some date</dd>
    </dl>
</body>
</html>
