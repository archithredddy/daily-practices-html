<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>NETFLIX</title>
    <style class="text/css">
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            background-image: url(/public/images/netflix-background-image.jpg);
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            background-color: rgba(0, 0, 0, 0.5);
            width: 100vw;
            height: 80vh;
            margin: 0;








        }


        .title {
            font-size: 60px;
            font-weight: bold;
            color: white;
            margin-right: 100;
            margin-left: 85px;
        }

        .sub-title {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            color: white;
            margin-top: 20px;

        }

        .icons {
            font-size: 15px;
            color: red;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        main {

            width: 100vw;
            height: 80vh;
            margin: -8px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .email-text input {
            background-color: rgba(0, 0, 0, 0.6);

            border: 1px solid white;


            width: 300px;
            border-radius: 5px;
            font-size: 20px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.4);



        }

        .button button {
            background-color: red;
            border: 1px solid red;
            color: white;
            width: 300px;
            border-radius: 5px;
            font-size: 20px;
            padding: 15px;
            margin-left: 5px;



        }

        .header {
            color: white;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            margin-top: 30px;




        }

        .logo img {
            height: 100px;
            width: 200px;





            font-weight: bold;
        }

        /* .button-1 button {
            background-color: rgba(0, 0, 0, 0.6);
            border-color: 1px solid lightgray;

            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 5px;
            margin: 5px;
            width: 150px;
            border-radius: 5px;


        } */
        .button-1 button {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid lightgray;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 5px;
            margin: 5px;
            width: 150px;
            border-radius: 5px;
        }

        .button-2 input {

            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.6);
            background-color: red;
            background-color: 1px solid red;
            color: white;
            font-size: 20px;
            padding: 5px;
            margin: 5px;
            width: 150px;



        }

        section {
            background-color: rgba(0, 0, 0, 0.6);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<!--this is body section-->

<body>
    <section>


        <header>
            <div class="header">
                <div class="logo">

                    <img src="/public/images/netflix-2-logo-svgrepo-com.svg">
                </div>
                <div>
                    <span class="button-1">
                        <button><i class="bi bi-translate"></i>English <i class="bi bi-caret-down-fill"></i></button>
                    </span>
                    <span class="button-2">
                        <input type="button" value="sign in">
                    </span>

                </div>

            </div>
        </header>

        <main>

            <div class="shade">
                <div class="title">
                    Unlimited movies,
                </div>
                <div class="title">
                    Shows,and More
                </div>
                <div class="sub-title">
                    Starts at ₹149. Cancel at any time.
                </div>
                <div class="sub-title">
                    Ready to watch? Enter your email to create or restart your membership.
                </div>
                <div class="icons">
                    <span class="email-text">
                        <input type="email" name="email" placeholder="email address" id="email">
                    </span>
                    <span class="button">

                        <button>Get started <i class="bi bi-chevron-compact-right"></i></button>



                    </span>


                </div>
            </div>
        </main>
    </section>

</body>
