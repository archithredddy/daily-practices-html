<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details summary</title>
    <style class="text/css">
        summary~span{
            display: block;
            background-color: black;
            color: white;
            margin-bottom: 20px;
            padding: 10px;
            margin-left: 10px;
            width: 200px;
            font-size: 20px;
        }
        nav details{
            margin-left: 20px;
        }
        summary{
            font-size: 30px;
        }
    </style>
</head>
<body>
    <nav>
    <details>
<summary>HTML</summary>
<span>Normal elements</span>
<span>void elements</span>
<span>RCdata elements</span>
<span>Rawtext elements</span>

    </details>
    <details>
        <summary>CSS</summary>
        <span>InlineCSS</span>
<span>EmbededCSS</span>
<span>ExternalCSS</span>
<span>BootstrapLibrary</span>
    </details>
    <details>
        <summary>JAVASCRIPT</summary>
        <span>Inlinejs</span>
        <span>Embededjs</span>
        <span>Externaljs</span>
       <span>JQuerylibrary</span>
        
    </details>
   </nav>
    
</body>
</html>
