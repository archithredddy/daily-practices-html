<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style class="text/css">
        dd {
            width: 400px;
            padding: 10px;
             background-color: gray;
                color: black;
                width: 400px;
                margin-bottom: 10px;
                padding: 10px;
            }
        

        fieldset {
            background-image: url(/public/images/sachin.jpg);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            width: 400px;
            margin: 25px;
            margin-bottom: 20px;
            border-radius: 25px;
            /* shadow */
            box-shadow:5px 5px 5px green; 

        }
        legend{
            box-shadow:5px 5px 5px orange;
            margin: 10px; 
        }

        legend {
            background-color: black;
            color: white;
            text-align: center;
            padding: 5px;
            border-radius: 15px;

        }

        dl {
            display: grid;
            grid-template-columns: 3fr 9fr;
        }

        dt{
            background-color: black;
            color: white;
            width: 200px;
            margin-bottom: 10px;
            padding: 10px;

           
        }
    </style>
</head>

<body>
    <fieldset>
        <legend>
            Person details
        </legend>
        <dl>
            <dt>
                First name
            </dt>
            <dd>
                SomeName
            </dd>
            <dt>
                Last name
            </dt>
            <dd>
                SomeName
            </dd>
            <dt>
                Age
            </dt>
            <dd>
                Some Age
            </dd>
        </dl>
    </fieldset>

     <fieldset>
        <legend>
            Contact details
        </legend>
        <dl>
            <dt>
                City
            </dt>
            <dd>
                Somecity
            </dd>
            <dt>
                State
            </dt>
            <dd>
                Somestate
            </dd>
            <dt>
                Postalcode
            </dt>
            <dd>
                Some postalcode
            </dd>
        </dl>
    </fieldset>
</body>

</html>
